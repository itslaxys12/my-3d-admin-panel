services:
  - type: web
    name: glitch-3d-admin-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: glitch-3d-admin-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bots/api_server.py
    plan: free
