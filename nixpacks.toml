# Railway Nixpacks Configuration
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools", "python311Packages.wheel", "ffmpeg"]

[phases.install]
cmds = [
  "pip install -r requirements.txt"
]

[variables]
PYTHONUNBUFFERED = "1"

[start]
cmd = "python -u bots/api_server.py"

